name: Autograder

# Runs the JUnit tests every time a student pushes.
# Green check = all tests pass. Red X = open the run to see which tests failed.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Assignment tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
